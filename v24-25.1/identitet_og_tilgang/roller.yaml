apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pseudonymadminrolle
  namespace: pseudonymrom
rules:
  - apiGroups: ["", "apps", "batch", "extensions"]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - secrets
      - deployments
      - replicasets
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
